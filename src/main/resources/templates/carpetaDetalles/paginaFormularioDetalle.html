<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title th:text="${detalle.uuid} != null ? 'Editar Inventario' : 'Nuevo Inventario'"></title>
	<div th:replace="~{fragmentos :: bootstrap}"></div>
</head>
<body>
	<div th:replace="~{fragmentos :: menu}"></div>

	<div class="container-fluid mt-4">
		<h1 th:text="${detalle.uuid} != null ? 'Editar Registro de Inventario' : '📦 Registrar Stock de Producto'" class="mb-4"></h1>

		<form th:action="${detalle.uuid} == null ? @{/rutaDetalles/guardar} : @{/rutaDetalles/actualizar}" 
			  method="post" th:object="${detalle}">

			<input type="hidden" th:field="*{uuid}" />

			<div class="mb-3">
				<label class="form-label fw-bold">Seleccionar Vehículo (Información Completa):</label>
				<select class="form-select" th:field="*{productoUuid}">
					<option value="">--- Selecciona un Auto de la Lista ---</option>
					<option th:each="pro : ${productos}" 
					        th:value="${pro.uuid}" 
					        th:text="${pro.marca} + ' ' + ${pro.subMarca} + ' ' + ${pro.modelo} + ' ' + 
					                 '(' + ${pro.anio} + ') — ' + 
					                 '$' + ${pro.precio} + ' | ' + 
					                 'Estado: ' + ${pro.estado}">
					</option>
				</select>
				<div class="text-danger" th:if="${#fields.hasErrors('productoUuid')}" th:errors="*{productoUuid}">Error</div>
			</div>

			<div class="row">
				<div class="col-md-6 mb-3">
					<label class="form-label fw-bold">Color:</label>
					<select class="form-select" th:field="*{colorUuid}">
						<option value="">--- Selecciona un Color ---</option>
						<option th:each="col : ${colores}" 
						        th:value="${col.uuid}" 
						        th:text="${col.nombre}">
						</option>
					</select>
					<div class="text-danger" th:if="${#fields.hasErrors('colorUuid')}" th:errors="*{colorUuid}">Error</div>
				</div>

				<div class="col-md-6 mb-3">
					<label class="form-label fw-bold">Cantidad en Stock:</label>
					<input type="number" step="1" class="form-control" th:field="*{stock}" placeholder="Ej. 10" />
					<div class="text-danger" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}">Error</div>
				</div>
			</div>

			<div class="mb-3">
				<label class="form-label fw-bold">Tipo de Transmisión:</label>
				<input type="text" class="form-control" th:field="*{transmision}" placeholder="Ej. Automática, Manual..." />
				<div class="text-danger" th:if="${#fields.hasErrors('transmision')}" th:errors="*{transmision}">Error</div>
			</div>

			<button type="submit" class="btn btn-success">Guardar</button>
			<a th:href="@{/rutaDetalles/listar}" class="btn btn-secondary">Cancelar</a>
		</form>
	</div>
</body>
</html>

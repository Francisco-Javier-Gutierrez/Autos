<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Control de Inventario - Detalles</title>
	<div th:replace="~{fragmentos :: bootstrap}"></div>
</head>
<body>
	<div th:replace="~{fragmentos :: menu}"></div>
	
	<div class="container-fluid mt-4">
		<h1 class="mb-4">Lista de Stock e Inventario (detProducto)</h1>
		
		<a th:href="@{/rutaDetalles/nuevo}" class="btn btn-primary mb-3">➕ Nuevo Inventario</a>

		<table class="table table-bordered table-striped table-sm">
			<thead class="table-dark">
				<tr>
					<th>Producto Relacionado</th>
					<th>Color</th>
					<th>Cantidad en Stock</th>
					<th>Transmisión</th>
					<th>Acciones</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="det : ${detalles}">
					<td th:text="${det.productoNombre}"></td>
					<td th:text="${det.colorNombre}"></td>
					<td th:text="${det.stock}"></td>
					<td th:text="${det.transmision}"></td>
					<td>
						<a th:href="@{'/rutaDetalles/editar/' + ${det.uuid}}" class="btn btn-sm btn-primary">✏️</a>
						<a th:href="@{'/rutaDetalles/eliminar/' + ${det.uuid}}" 
						   class="btn btn-sm btn-danger" 
						   onclick="return confirm('¿Está seguro de que desea eliminar este registro de inventario?')">🗑️</a>
					</td>
				</tr>
				<tr th:if="${#lists.isEmpty(detalles)}">
					<td colspan="5" class="text-center text-muted py-4">No hay registros de inventario asignados.</td>
				</tr>
			</tbody>
		</table>
	</div>
</body>
</html>

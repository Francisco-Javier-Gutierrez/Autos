<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title th:text="${pedido.uuid} != null ? 'Editar Pedido' : 'Nuevo Pedido'"></title>
	<div th:replace="~{fragmentos :: bootstrap}"></div>
	<style>
		.car-card:hover {
			transform: scale(1.02);
			box-shadow: 0 4px 15px rgba(0,0,0,0.1);
		}
	</style>
</head>
<body>
	<div th:replace="~{fragmentos :: menu}"></div>

	<div class="container-fluid mt-4">
		<h1 th:text="${pedido.uuid} != null ? 'Editar Pedido' : 'Nuevo Pedido'" class="mb-4"></h1>

		<form th:action="${pedido.uuid} == null ? @{/rutaPedidos/guardar} : @{/rutaPedidos/actualizar}" method="post" th:object="${pedido}">
			<input type="hidden" th:field="*{uuid}" />

			<div class="row">
				<!-- Panel de Autos Disponibles (75% de ancho) -->
				<div class="col-md-9 border-end">
					<h3 class="mb-3">🚗 Autos Disponibles</h3>
					
					<!-- Campo select oculto para enlazar con Thymeleaf -->
					<select id="selectVehiculo" class="d-none" th:field="*{detProdUuid}">
						<option value="">--- Selecciona un Vehículo ---</option>
						<option th:each="det : ${detalles}" 
						        th:value="${det.uuid}" 
						        th:data-precio="${det.producto.precio}"
						        th:data-stock="${det.stock}"
						        th:text="(${det.producto != null} ? ${det.producto.marca} + ' ' + ${det.producto.subMarca} + ' ' + ${det.producto.modelo} : '')">
						</option>
					</select>
					<div class="text-danger mb-3" th:if="${#fields.hasErrors('detProdUuid')}" th:errors="*{detProdUuid}">Error</div>

					<div class="row row-cols-1 row-cols-md-3 g-3">
						<div class="col" th:each="det : ${detalles}">
							<div class="card h-100 car-card" 
							     th:id="'car-card-' + ${det.uuid}"
							     th:data-uuid="${det.uuid}"
							     th:data-precio="${det.producto.precio}"
							     th:data-stock="${det.stock}"
							     onclick="selectCar(this.getAttribute('data-uuid'), parseFloat(this.getAttribute('data-precio')), parseInt(this.getAttribute('data-stock')))"
							     style="cursor: pointer; transition: all 0.2s ease-in-out;">
								<div class="card-body">
									<h5 class="card-title fw-bold" th:text="${det.producto.marca} + ' ' + ${det.producto.subMarca} + ' ' + ${det.producto.modelo}">Auto</h5>
									<p class="card-text mb-1">
										<strong>Año:</strong> <span th:text="${det.producto.anio}"></span>
									</p>
									<p class="card-text mb-1">
										<strong>Transmisión:</strong> <span th:text="${det.transmision}"></span>
									</p>
									<p class="card-text mb-1">
										<strong>Color:</strong> <span th:text="${det.color.nombre}"></span>
									</p>
									<p class="card-text mb-1">
										<strong>Stock:</strong> 
										<span class="badge text-dark" th:classappend="${det.stock == 0 ? 'bg-danger' : 'bg-success'}" 
 										      th:text="${det.stock}">0</span>
									</p>
									<p class="card-text mb-0 mt-2 fs-5 fw-bold text-primary" 
									   th:text="${'$' + #numbers.formatDecimal(det.producto.precio, 1, 'COMMA', 2, 'POINT')}">
										$0.00
									</p>
								</div>
							</div>
						</div>
					</div>
				</div>

				<!-- Panel del Total y Datos del Pedido (25% de ancho) -->
				<div class="col-md-3">
					<h3 class="mb-3">📋 Datos del Pedido</h3>

					<div class="mb-3">
						<label class="form-label fw-bold">Cliente:</label>
						<select class="form-select" th:field="*{clienteUuid}">
							<option value="">--- Selecciona un Cliente ---</option>
							<option th:each="cli : ${clientes}" 
							        th:value="${cli.uuid}" 
							        th:text="${cli.nombre} + ' (' + ${cli.correo} + ')'">
							</option>
						</select>
						<div class="text-danger" th:if="${#fields.hasErrors('clienteUuid')}" th:errors="*{clienteUuid}">Error</div>
					</div>

					<div class="mb-3">
						<label class="form-label fw-bold">Seleccionar Unidad (VIN):</label>
						<select id="selectNumeroSerie" class="form-select" onchange="onSerialSelected()">
							<option value="">--- Asignación Automática / Seleccionar VIN ---</option>
							<option th:each="ns : ${series}" 
							        th:value="${ns.uuid}" 
							        th:data-detprod-uuid="${ns.detProd != null ? ns.detProd.uuid : ''}"
							        th:text="${ns.numeroSerie} + ' (' + ${ns.estadoUnidad} + ')'">
							</option>
						</select>
					</div>

					<div class="mb-3">
						<label class="form-label fw-bold">Unidades Seleccionadas:</label>
						<div id="selectedVinsContainer" class="p-2 border rounded bg-white" style="min-height: 50px;">
							<span class="text-muted fs-7" id="noVinsText">Ninguna unidad seleccionada (Asignación Automática)</span>
						</div>
						<div id="hiddenVinsInputs">
							<input type="hidden" th:each="nsUuid : ${pedido.numeroSerieUuids}" 
							       class="selected-vin-input" 
							       name="numeroSerieUuids" 
							       th:value="${nsUuid}" />
						</div>
						<div class="text-danger" th:if="${#fields.hasErrors('numeroSerieUuids')}" th:errors="*{numeroSerieUuids}">Error</div>
					</div>

					<div class="mb-3">
						<label class="form-label fw-bold">Cantidad:</label>
						<input type="number" id="inputCantidad" step="1" class="form-control" th:field="*{cantidad}" placeholder="Ej. 1" oninput="updateTotal()" />
						<div class="text-danger" th:if="${#fields.hasErrors('cantidad')}" th:errors="*{cantidad}">Error</div>
					</div>

					<div class="mb-3">
						<label class="form-label fw-bold">Número de Factura:</label>
						<input type="text" class="form-control bg-light" th:field="*{numFactura}" readonly placeholder="Generado al guardar" />
					</div>

					<div class="mb-3">
						<label class="form-label fw-bold">Total Estimado ($):</label>
						<input type="text" id="displayTotal" class="form-control bg-light fs-4 fw-bold text-success" th:field="*{total}" readonly placeholder="$0.00" />
					</div>

					<div class="mb-3">
						<label class="form-label">Estatus:</label>
						<select class="form-select" th:field="*{estadoPedido}">
							<option th:each="estado : ${estados}" th:value="${estado}" th:text="${estado}"></option>
						</select>
					</div>

					<div class="mb-3">
						<label class="form-label">Valoración (Rubi FA):</label>
						<input type="number" min="1" max="5" class="form-control" th:field="*{valoracionRubiFA}" />
						<div class="text-danger" th:if="${#fields.hasErrors('valoracionRubiFA')}" th:errors="*{valoracionRubiFA}">Error</div>
					</div>

					<div class="mb-3">
						<label class="form-label">Favorito (Perla MM):</label>
						<select class="form-select" th:field="*{favoritoPerlaMM}">
							<option th:value="true">Sí</option>
							<option th:value="false">No</option>
						</select>
					</div>

					<div class="mb-3">
						<label class="form-label">Reseña (Francely Anaid GH):</label>
						<input type="text" class="form-control" th:field="*{resenaFrancelyAnaidGH}" />
					</div>

					<div class="mb-3">
						<label class="form-label">Nivel de Interés (Francisco Javier GH):</label>
						<select class="form-select" th:field="*{nivelInteresFranciscoJavierGH}">
							<option value="1">Bajo</option>
							<option value="2">Medio</option>
							<option value="3">Alto</option>
						</select>
						<div class="text-danger" th:if="${#fields.hasErrors('nivelInteresFranciscoJavierGH')}" th:errors="*{nivelInteresFranciscoJavierGH}">Error</div>
					</div>

					<hr>
					<div class="d-grid gap-2">
						<button type="submit" class="btn btn-success btn-lg">Guardar Pedido</button>
						<a th:href="@{/rutaPedidos/listar}" class="btn btn-secondary">Cancelar</a>
					</div>
				</div>
			</div>
		</form>
	</div>

	<script th:inline="javascript">
		/*<![CDATA[*/
		const originalUuid = /*[[${pedido.detProdUuid}]]*/ null;
		const originalCantidad = /*[[${pedido.cantidad != null ? pedido.cantidad : 0}]]*/ 0;
		/*]]>*/

		let selectedPrice = 0;
		let selectedStock = 0;

		function filterSerials(detProdUuid) {
			const select = document.getElementById('selectNumeroSerie');
			
			if (!select.dataset.originalOptions) {
				const options = Array.from(select.options).map(opt => ({
					value: opt.value,
					text: opt.text,
					detProdUuid: opt.getAttribute('data-detprod-uuid') || ''
				}));
				select.dataset.originalOptions = JSON.stringify(options);
			}
			
			const originalOptions = JSON.parse(select.dataset.originalOptions);
			select.innerHTML = '';
			
			originalOptions.forEach(opt => {
				if (opt.value === '' || opt.detProdUuid === detProdUuid) {
					const newOpt = document.createElement('option');
					newOpt.value = opt.value;
					newOpt.text = opt.text;
					newOpt.setAttribute('data-detprod-uuid', opt.detProdUuid);
					
					if (opt.value !== '' && document.querySelector(`.selected-vin-input[value="${opt.value}"]`)) {
						newOpt.disabled = true;
					}
					
					select.appendChild(newOpt);
				}
			});
			select.value = '';
		}

		function onSerialSelected() {
			const select = document.getElementById('selectNumeroSerie');
			const selectedUuid = select.value;
			if (!selectedUuid) return;
			const selectedText = select.options[select.selectedIndex].text;
			addVin(selectedUuid, selectedText);
		}

		function addVin(uuid, text) {
			if (!uuid) return;
			const container = document.getElementById('selectedVinsContainer');
			const hiddenContainer = document.getElementById('hiddenVinsInputs');
			const noVinsText = document.getElementById('noVinsText');
			
			if (document.querySelector(`.selected-vin-input[value="${uuid}"]`)) {
				return;
			}
			
			if (noVinsText) noVinsText.style.display = 'none';
			
			const badge = document.createElement('div');
			badge.className = 'badge bg-primary text-white p-2 m-1 d-inline-flex align-items-center selected-vin-badge';
			badge.id = 'badge-' + uuid;
			badge.innerHTML = `
				<span>${text}</span>
				<button type="button" class="btn-close btn-close-white ms-2" style="font-size: 0.5rem;" onclick="removeVin('${uuid}')"></button>
			`;
			container.appendChild(badge);
			
			const input = document.createElement('input');
			input.type = 'hidden';
			input.className = 'selected-vin-input';
			input.name = 'numeroSerieUuids';
			input.value = uuid;
			hiddenContainer.appendChild(input);
			
			const select = document.getElementById('selectNumeroSerie');
			for (let i = 0; i < select.options.length; i++) {
				if (select.options[i].value === uuid) {
					select.options[i].disabled = true;
					break;
				}
			}
			select.value = '';
			
			onVinsCountChanged();
		}

		function removeVin(uuid) {
			const badge = document.getElementById('badge-' + uuid);
			if (badge) badge.remove();
			
			const input = document.querySelector(`.selected-vin-input[value="${uuid}"]`);
			if (input) input.remove();
			
			const select = document.getElementById('selectNumeroSerie');
			for (let i = 0; i < select.options.length; i++) {
				if (select.options[i].value === uuid) {
					select.options[i].disabled = false;
					break;
				}
			}
			
			const container = document.getElementById('selectedVinsContainer');
			const badges = container.querySelectorAll('.selected-vin-badge');
			if (badges.length === 0) {
				const noVinsText = document.getElementById('noVinsText');
				if (noVinsText) noVinsText.style.display = 'block';
			}
			
			onVinsCountChanged();
		}

		function onVinsCountChanged() {
			const inputs = document.querySelectorAll('.selected-vin-input');
			const count = inputs.length;
			const inputCantidad = document.getElementById('inputCantidad');
			
			if (count > 0) {
				inputCantidad.value = count;
				inputCantidad.readOnly = true;
				inputCantidad.max = count;
			} else {
				inputCantidad.readOnly = false;
				let maxLimit = selectedStock;
				const selectVehiculo = document.getElementById('selectVehiculo');
				const selectedUuid = selectVehiculo.value;
				if (originalUuid && originalUuid === selectedUuid) {
					maxLimit = selectedStock + originalCantidad;
				}
				inputCantidad.max = maxLimit;
				if (parseInt(inputCantidad.value) > maxLimit) {
					inputCantidad.value = maxLimit;
				}
			}
			updateTotal();
		}

		function selectCar(uuid, price, stock) {
			document.getElementById('selectVehiculo').value = uuid;
			selectedPrice = price;
			selectedStock = stock;

			const selectVehiculo = document.getElementById('selectVehiculo');
			if (selectVehiculo.dataset.lastUuid && selectVehiculo.dataset.lastUuid !== uuid) {
				const container = document.getElementById('selectedVinsContainer');
				container.innerHTML = '<span class="text-muted fs-7" id="noVinsText">Ninguna unidad seleccionada (Asignación Automática)</span>';
				const hiddenContainer = document.getElementById('hiddenVinsInputs');
				hiddenContainer.innerHTML = '';
			}
			selectVehiculo.dataset.lastUuid = uuid;

			filterSerials(uuid);

			const inputCantidad = document.getElementById('inputCantidad');
			let maxLimit = stock;
			if (originalUuid && originalUuid === uuid) {
				maxLimit = stock + originalCantidad;
			}
			inputCantidad.max = maxLimit;
			inputCantidad.min = 1;
			
			if (parseInt(inputCantidad.value) > maxLimit) {
				inputCantidad.value = maxLimit;
			}

			document.querySelectorAll('.car-card').forEach(card => {
				card.classList.remove('border-primary', 'bg-light', 'shadow');
			});

			const selectedCard = document.getElementById('car-card-' + uuid);
			if (selectedCard) {
				selectedCard.classList.add('border-primary', 'bg-light', 'shadow');
			}

			onVinsCountChanged();
		}

		function updateTotal() {
			const cantidad = parseInt(document.getElementById('inputCantidad').value) || 0;
			const total = cantidad * selectedPrice;
			document.getElementById('displayTotal').value = total.toFixed(2);
		}

		window.addEventListener('DOMContentLoaded', () => {
			const selectSerials = document.getElementById('selectNumeroSerie');
			if (selectSerials && !selectSerials.dataset.originalOptions) {
				const options = Array.from(selectSerials.options).map(opt => ({
					value: opt.value,
					text: opt.text,
					detProdUuid: opt.getAttribute('data-detprod-uuid') || ''
				}));
				selectSerials.dataset.originalOptions = JSON.stringify(options);
			}

			const preselectedInputs = document.querySelectorAll('.selected-vin-input');
			preselectedInputs.forEach(input => {
				const uuid = input.value;
				let text = uuid;
				for (let i = 0; i < selectSerials.options.length; i++) {
					if (selectSerials.options[i].value === uuid) {
						text = selectSerials.options[i].text;
						selectSerials.options[i].disabled = true;
						break;
					}
				}
				
				const container = document.getElementById('selectedVinsContainer');
				const noVinsText = document.getElementById('noVinsText');
				if (noVinsText) noVinsText.style.display = 'none';
				
				const badge = document.createElement('div');
				badge.className = 'badge bg-primary text-white p-2 m-1 d-inline-flex align-items-center selected-vin-badge';
				badge.id = 'badge-' + uuid;
				badge.innerHTML = `
					<span>${text}</span>
					<button type="button" class="btn-close btn-close-white ms-2" style="font-size: 0.5rem;" onclick="removeVin('${uuid}')"></button>
				`;
				container.appendChild(badge);
			});

			const selectedUuid = document.getElementById('selectVehiculo').value;
			if (selectedUuid) {
				const selectEl = document.getElementById('selectVehiculo');
				const selectedOption = selectEl.options[selectEl.selectedIndex];
				if (selectedOption) {
					const price = parseFloat(selectedOption.getAttribute('data-precio')) || 0;
					const stock = parseInt(selectedOption.getAttribute('data-stock')) || 0;
					selectCar(selectedUuid, price, stock);
				}
			}
		});
	</script>
</body>
</html>

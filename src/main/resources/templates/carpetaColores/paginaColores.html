<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Gestión de Colores</title>
	<div th:replace="~{fragmentos :: bootstrap}"></div>
</head>
<body>
	<div th:replace="~{fragmentos :: menu}"></div>

	<div class="container-fluid mt-4">
		<h1 class="mb-4">Lista de Colores Registrados</h1>
		
		<a th:href="@{/rutaColores/nuevo}" class="btn btn-primary mb-3">➕ Nuevo Color</a>

		<div class="alert alert-success py-2" th:if="${mensaje}" th:text="${mensaje}"></div>
		<div class="alert alert-danger py-2" th:if="${mensajeError}" th:text="${mensajeError}"></div>

		<table class="table table-bordered table-striped table-sm">
			<thead class="table-dark">
				<tr>
					<th>ID Color</th>
					<th>Nombre del Color</th>
					<th>Estado / Disponibilidad</th>
					<th>Acciones</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="col : ${colores}">
					<td th:text="${col.id}"></td>
					<td th:text="${col.nombre}"></td>
					<td th:text="${col.estadoColor}"></td>
					<td>
						<a th:href="@{/rutaColores/editar/{uuid}(uuid=${col.uuid})}" class="btn btn-sm btn-primary">✏️</a>
						<a th:href="@{/rutaColores/eliminar/{uuid}(uuid=${col.uuid})}" 
						   class="btn btn-sm btn-danger"
						   onclick="return confirm('¿Estás seguro de eliminar este color?');">🗑️</a>
					</td>
				</tr>
				<tr th:if="${#lists.isEmpty(colores)}">
					<td colspan="4" class="text-center text-muted py-4">No hay colores registrados en el sistema.</td>
				</tr>
			</tbody>
		</table>
	</div>
</body>
</html>

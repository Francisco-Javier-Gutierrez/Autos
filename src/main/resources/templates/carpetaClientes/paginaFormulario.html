<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title th:text="${cliente.uuid} != null ? 'Editar Cliente' : 'Nuevo Cliente'"></title>
	<div th:replace="~{fragmentos :: bootstrap}"></div>
</head>
<body>
	<div th:replace="~{fragmentos :: menu}"></div>

	<div class="container-fluid mt-4">
		<h1 th:text="${cliente.uuid} != null ? 'Editar Cliente' : 'Nuevo Cliente'" class="mb-4"></h1>

		<form th:action="${cliente.uuid} == null ? @{/rutaClientes/guardar} : @{/rutaClientes/actualizar}" 
			  method="post" th:object="${cliente}">

			<input type="hidden" th:field="*{uuid}" />

			<div class="mb-3">
				<label class="form-label fw-bold">Nombre Completo:</label>
				<input type="text" class="form-control" th:field="*{nombre}" />
				<div class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">Error</div>
			</div>

			<div class="mb-3">
				<label class="form-label fw-bold">Correo Electrónico:</label>
				<input type="email" class="form-control" th:field="*{correo}" />
				<div class="text-danger" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}">Error</div>
			</div>

			<div class="mb-3">
				<label class="form-label fw-bold">Teléfono:</label>
				<input type="text" class="form-control" th:field="*{telefono}" />
				<div class="text-danger" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}">Error</div>
			</div>

			<div class="mb-3">
				<label class="form-label fw-bold">Estatus:</label>
				<select class="form-select" th:field="*{estatus}">
					<option th:each="est : ${estatusList}" th:value="${est}" th:text="${est}"></option>
				</select>
			</div>

			<button type="submit" class="btn btn-success">Guardar</button>
			<a th:href="@{/rutaClientes/listar}" class="btn btn-secondary">Cancelar</a>
		</form>
	</div>
</body>
</html>

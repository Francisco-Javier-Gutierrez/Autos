<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Catálogo de Vehículos</title>
	<div th:replace="~{fragmentos :: bootstrap}"></div>
</head>
<body>
	<div th:replace="~{fragmentos :: menu}"></div>
	
	<div class="container-fluid mt-4">
		<h1 class="mb-4">Inventario de Vehículos (Productos)</h1>
		
		<a th:href="@{/rutaProductos/nuevo}" class="btn btn-primary mb-3">➕ Nuevo Auto</a>

		<table class="table table-bordered table-striped table-sm">
			<thead class="table-dark">
				<tr>
					<th>Marca</th>
					<th>SubMarca</th>
					<th>Modelo</th>
					<th>Año</th>
					<th>Precio</th>
					<th>Condición</th>
					<th>Estatus</th>
					<th>Val. Rubi</th>
					<th>Fav. Perla</th>
					<th>Nivel Francisco</th>
					<th>Reseña Francely</th>
					<th>Acciones</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="producto : ${productos}">
					<td th:text="${producto.marca}"></td>
					<td th:text="${producto.subMarca}"></td>
					<td th:text="${producto.modelo}"></td>
					<td th:text="${producto.anio}"></td>
					<td th:text="${'$' + #numbers.formatDecimal(producto.precio, 1, 'COMMA', 2, 'POINT')}"></td>
					<td th:text="${producto.condicion}"></td>
					<td th:text="${producto.estado}"></td>
					<td th:text="${producto.valoracionRubiFA}"></td>
					<td th:text="${producto.favoritoPerlaMM ? 'Sí' : 'No'}"></td>
					<td th:switch="${producto.nivelInteresFranciscoJavierGH}">
						<span th:case="1">Bajo</span>
						<span th:case="2">Medio</span>
						<span th:case="3">Alto</span>
						<span th:case="*">-</span>
					</td>
					<td th:text="${producto.resenaFrancelyAnaidGH}"></td>
					<td>
						<a th:href="@{'/rutaProductos/editar/' + ${producto.uuid}}" class="btn btn-sm btn-primary">✏️</a>
						<a th:href="@{'/rutaProductos/eliminar/' + ${producto.uuid}}" 
						   class="btn btn-sm btn-danger" 
						   onclick="return confirm('¿Está seguro de que desea dar de baja este vehículo?')">🗑️</a>
					</td>
				</tr>
				<tr th:if="${#lists.isEmpty(productos)}">
					<td colspan="12" class="text-center text-muted py-4">No hay vehículos registrados en el catálogo.</td>
				</tr>
			</tbody>
		</table>
	</div>
</body>
</html>

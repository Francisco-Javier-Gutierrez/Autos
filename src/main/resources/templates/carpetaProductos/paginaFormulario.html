<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title th:text="${producto.uuid} != null ? 'Editar Vehículo' : 'Nuevo Vehículo'"></title>
	<div th:replace="~{fragmentos :: bootstrap}"></div>
</head>
<body>
	<div th:replace="~{fragmentos :: menu}"></div>

	<div class="container-fluid mt-4">
		<h1 th:text="${producto.uuid} != null ? 'Editar Vehículo' : 'Nuevo Vehículo'" class="mb-4"></h1>

		<form th:action="${producto.uuid} == null ? @{/rutaProductos/guardar} : @{/rutaProductos/actualizar}" 
			  method="post" th:object="${producto}" id="productoForm">

			<input type="hidden" th:field="*{uuid}" />

			<div class="row">
				<div class="col-md-6 mb-3">
					<label class="form-label fw-bold">Marca:</label>
					<input type="text" class="form-control" th:field="*{marca}" />
					<div class="text-danger" th:if="${#fields.hasErrors('marca')}" th:errors="*{marca}">Error</div>
				</div>

				<div class="col-md-6 mb-3">
					<label class="form-label fw-bold">SubMarca:</label>
					<input type="text" class="form-control" th:field="*{subMarca}" />
					<div class="text-danger" th:if="${#fields.hasErrors('subMarca')}" th:errors="*{subMarca}">Error</div>
				</div>
			</div>

			<div class="mb-3">
				<label class="form-label fw-bold">Modelo (Versión):</label>
				<input type="text" class="form-control" th:field="*{modelo}" />
				<div class="text-danger" th:if="${#fields.hasErrors('modelo')}" th:errors="*{modelo}">Error</div>
			</div>

			<div class="row">
				<div class="col-md-6 mb-3">
					<label class="form-label fw-bold">Año:</label>
					<input type="number" class="form-control" th:field="*{anio}" />
					<div class="text-danger" th:if="${#fields.hasErrors('anio')}" th:errors="*{anio}">Error</div>
				</div>

				<div class="col-md-6 mb-3">
					<label class="form-label fw-bold">Precio ($):</label>
					<input type="number" step="0.01" class="form-control" th:field="*{precio}" />
					<div class="text-danger" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}">Error</div>
				</div>
			</div>

			<div class="row">
				<div class="col-md-6 mb-3">
					<label class="form-label fw-bold">Condición:</label>
					<select class="form-select" th:field="*{condicion}">
						<option th:each="cond : ${condiciones}" th:value="${cond}" th:text="${cond}"></option>
					</select>
				</div>

				<div class="col-md-6 mb-3">
					<label class="form-label fw-bold">Estatus Operativo:</label>
					<select class="form-select" th:field="*{estado}">
						<option th:each="est : ${estados}" th:value="${est}" th:text="${est}"></option>
					</select>
				</div>
			</div>

			<div class="row">
				<div class="col-md-6 mb-3">
					<label class="form-label fw-bold">Valoración RubiFA (1-5):</label>
					<input type="number" min="1" max="5" class="form-control" th:field="*{valoracionRubiFA}" />
					<div class="text-danger" th:if="${#fields.hasErrors('valoracionRubiFA')}" th:errors="*{valoracionRubiFA}">Error</div>
				</div>

				<div class="col-md-6 mb-3">
					<label class="form-label fw-bold">Nivel de Interés FranciscoJavierGH:</label>
					<input type="number" class="form-control" th:field="*{nivelInteresFranciscoJavierGH}" />
				</div>
			</div>

			<div class="mb-3">
				<label class="form-label fw-bold">Reseña FrancelyAnaidGH:</label>
				<textarea class="form-control" rows="2" th:field="*{resenaFrancelyAnaidGH}"></textarea>
			</div>

			<div class="mb-3 form-check form-switch mt-3">
				<input class="form-check-input" type="checkbox" role="switch" id="favPerla" th:field="*{favoritoPerlaMM}">
				<label class="form-check-label fw-bold" for="favPerla">Marcar como Favorito PerlaMM ⭐</label>
			</div>

			<button type="submit" class="btn btn-success">Guardar</button>
			<a th:href="@{/rutaProductos/listar}" class="btn btn-secondary">Cancelar</a>
		</form>
	</div>

	<!-- Modal para Auto Existente -->
	<div class="modal fade" id="autoExisteModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="autoExisteModalLabel" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content shadow-lg border-0 rounded-3">
				<div class="modal-header bg-primary text-dark border-bottom-0">
					<h5 class="modal-title fw-bold text-dark" id="autoExisteModalLabel">
						⚠️ ¡El vehículo ya existe!
					</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-body py-4">
					<p class="mb-2 fs-5 text-dark">Este auto ya ha sido registrado previamente con las mismas características:</p>
					<div class="p-3 bg-light rounded-3 text-secondary small">
						<strong>Campos coincidentes:</strong> Marca, SubMarca, Modelo, Año y Condición.
					</div>
					<p class="mt-3 mb-0 text-muted">No es posible crear un duplicado de este vehículo.</p>
				</div>
				<div class="modal-footer border-top-0 pt-0">
					<a id="btnEditarAuto" href="#" class="btn btn-primary px-4 fw-semibold">Editar</a>
					<button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">Cancelar</button>
				</div>
			</div>
		</div>
	</div>

	<script>
		document.addEventListener("DOMContentLoaded", function() {
			const form = document.getElementById("productoForm");
			const uuidInput = document.getElementById("uuid") || document.querySelector("input[name='uuid']");
			
			// Solo validar duplicados si estamos registrando un auto nuevo (uuid está vacío)
			if (form && (!uuidInput || !uuidInput.value)) {
				form.addEventListener("submit", function(event) {
					event.preventDefault();
					
					const marca = document.getElementById("marca").value.trim();
					const subMarca = document.getElementById("subMarca").value.trim();
					const modelo = document.getElementById("modelo").value.trim();
					const anio = document.getElementById("anio").value.trim();
					const condicion = document.getElementById("condicion").value;
					
					if (!marca || !subMarca || !modelo || !anio || !condicion) {
						form.submit();
						return;
					}
					
					const params = new URLSearchParams({
						marca: marca,
						subMarca: subMarca,
						modelo: modelo,
						anio: anio,
						condicion: condicion
					});
					
					fetch('/rutaProductos/validar-duplicado?' + params.toString())
						.then(response => response.json())
						.then(data => {
							if (data.exists) {
								const btnEditar = document.getElementById("btnEditarAuto");
								btnEditar.href = '/rutaProductos/editar/' + data.uuid;
								
								const modal = new bootstrap.Modal(document.getElementById('autoExisteModal'));
								modal.show();
							} else {
								form.submit();
							}
						})
						.catch(error => {
							console.error('Error al validar duplicado:', error);
							form.submit();
						});
				});
			}
		});
	</script>
</body>
</html>

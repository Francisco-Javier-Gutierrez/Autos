<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Reporte de Disponibilidad por Color</title>
	<div th:replace="~{fragmentos :: bootstrap}"></div>
	<!-- html2pdf.js CDN library -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
	<div th:replace="~{fragmentos :: menu}"></div>
	
	<div class="container-fluid mt-4">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<h1 class="mb-0">Reporte de Disponibilidad de Vehículos por Color</h1>
			<button onclick="exportToPDF()" class="btn btn-danger">📄 Descargar PDF</button>
		</div>
		
		<div th:if="${#maps.isEmpty(reporte)}" class="alert alert-warning py-3 text-center">
			No hay datos de inventario o colores registrados para generar el reporte.
		</div>

		<!-- Elemento contenedor que será exportado a PDF -->
		<div id="reportContent" class="p-2">
			<div th:each="entry : ${reporte}" class="mb-5">
				<div class="d-flex justify-content-between align-items-center mb-2 pb-1 border-bottom"
				     th:with="coloresEspEng=${ {
				         'Rojo': '#dc3545',
				         'Negro': '#212529',
				         'Blanco': '#555555',
				         'Gris': '#6c757d',
				         'Azul': '#0d6efd',
				         'Plata': '#868e96',
				         'Verde': '#198754',
				         'Amarillo': '#d9a711',
				         'Naranja': '#fd7e14',
				         'Marrón': '#8b4513'
				     } }">
					<h3 class="mb-0">
						🎨 Color: <span class="fw-bold" th:style="'color: ' + (${coloresEspEng[entry.key.nombre]} ?: ${entry.key.nombre}) + '; text-shadow: 1px 1px 1px rgba(0,0,0,0.15);'" th:text="${entry.key.nombre}">Azul</span>
						<span class="small text-muted" th:text="'(' + ${entry.key.estadoColor} + ')'"></span>
					</h3>
					<span class="badge bg-primary fs-6" 
					      th:text="'Total Stock: ' + ${#aggregates.sum(entry.value.![stock])}">
						Total Stock: 0
					</span>
				</div>

				<table class="table table-bordered table-striped table-sm">
					<thead class="table-dark">
						<tr>
							<th>Marca</th>
							<th>SubMarca</th>
							<th>Modelo</th>
							<th>Año</th>
							<th>Precio Unitario</th>
							<th>Transmisión</th>
							<th>Stock Disponible</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="det : ${entry.value}">
							<td th:text="${det.producto.marca}"></td>
							<td th:text="${det.producto.subMarca}"></td>
							<td th:text="${det.producto.modelo}"></td>
							<td class="text-center" th:text="${det.producto.anio}"></td>
							<td class="text-end" th:text="${'$' + #numbers.formatDecimal(det.producto.precio, 1, 'COMMA', 2, 'POINT')}"></td>
							<td th:text="${det.transmision}"></td>
							<td class="text-center fw-bold" th:text="${det.stock}"
							    th:classappend="${det.stock == 0 ? 'text-danger' : 'text-dark'}"></td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>

	<script>
		function exportToPDF() {
			const element = document.getElementById('reportContent');
			const opt = {
				margin:       0.4,
				filename:     'Reporte_Disponibilidad_Colores.pdf',
				image:        { type: 'jpeg', quality: 0.98 },
				html2canvas:  { scale: 2, useCORS: true },
				jsPDF:        { unit: 'in', format: 'letter', orientation: 'landscape' }
			};
			html2pdf().set(opt).from(element).save();
		}
	</script>
</body>
</html>
